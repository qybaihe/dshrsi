<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#12b5e5"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#3f8cf2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#12b5e5" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- a conversation: two failed tool calls, then the harness's own notice, then a clean call -->
  <g fill="none" stroke="#8b93a1" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
    <rect x="364" y="36" width="244" height="30" rx="15" fill="#8b93a1" fill-opacity="0.16" stroke="none"/>
    <path d="M72 96h150"/>
    <path d="M72 126h150"/>
    <path d="M72 186h176"/>
  </g>
  <g fill="#8b93a1" fill-opacity="0.7">
    <rect x="44" y="89" width="14" height="14" rx="3"/>
    <rect x="44" y="119" width="14" height="14" rx="3"/>
    <rect x="44" y="179" width="14" height="14" rx="3"/>
  </g>
  <g fill="#e5484d">
    <circle cx="244" cy="96" r="5"/>
    <circle cx="244" cy="126" r="5"/>
  </g>
  <circle cx="270" cy="186" r="5" fill="none" stroke="#30a46c" stroke-width="2"/>
  <path d="M267.6 186l1.8 1.8 3.2-3.6" fill="none" stroke="#30a46c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the notice row: the harness improved itself -->
  <rect x="36" y="143" width="300" height="26" rx="13" fill="url(#sweep)" stroke="url(#ink)" stroke-width="1.5"/>
  <path d="M55.6 147.6 50.4 156h3.6l-.8 5.4 5.6-8.4h-3.8l.6-5.4Z" fill="url(#ink)"/>
  <path d="M72 156h168" stroke="url(#ink)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- the composer, and the pill under it -->
  <rect x="36" y="214" width="572" height="40" rx="14" fill="none" stroke="#8b93a1" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M56 234h120" stroke="#8b93a1" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="584" cy="234" r="11" fill="#8b93a1" fill-opacity="0.35"/>
  <rect x="404" y="262" width="204" height="22" rx="11" fill="url(#sweep)" stroke="url(#ink)" stroke-width="1.5"/>
  <path d="M421.4 265.8 416.8 273h3.2l-.7 4.8 5-7.4h-3.4l.5-4.6Z" fill="url(#ink)"/>
  <path d="M434 273h86" stroke="url(#ink)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M532 273h22M564 273h22" stroke="#8b93a1" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>

  <!-- the mark: the harness looping back onto itself -->
  <g transform="translate(404 74) scale(3.6)">
    <path d="M28.63 15.15A11 11 0 1 1 24.47 9.1" fill="none" stroke="url(#ink)" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M23.2 4.4 24.6 9.2 19.6 9.5" fill="none" stroke="url(#ink)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19.2 11.4 13.6 19h3.8l-.9 5.6L22.4 17h-4l.8-5.6Z" fill="url(#ink)"/>
  </g>
</svg>
